name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  style:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier
            command: npm run format:check
          - name: ESLint
            command: npm run lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: style

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: style

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Check coverage
        run: npm run test:cov

  bearer:
    name: Bearer SAST and secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: style

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bearer CLI
        run: curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Bearer SAST and secrets scan
        run: |
          bearer scan . \
            --scanner=sast,secrets \
            --severity critical,high,medium \
            --fail-on-severity critical,high,medium
